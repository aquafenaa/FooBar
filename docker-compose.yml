services:
  sandbox:
    build: ./sandbox
    container_name: foobar-sandbox
    hostname: foobar-sandbox
    restart: unless-stopped
    volumes:
      - workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    # starts the bot's own web server (see the web service) whenever the container starts, if the bot has written a start.sh for it.
    # its output goes to start.log, so the bot can see why it didn't come up
    command: ["sh", "-c", "mkdir -p /workspace/site; if [ -f /workspace/start.sh ]; then cd /workspace && setsid sh start.sh < /dev/null >> start.log 2>&1 & fi; exec sleep infinity"]
    init: true # a tiny init as PID 1, which cleans up the background processes the bot starts once they exit
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace/site"]
      interval: 10s

  # the bot's public website, at SITE_URL in .env. passes every request to the web server the bot runs in the sandbox, on port 80
  web:
    image: caddy:2.10-alpine
    container_name: foobar-web
    restart: unless-stopped
    depends_on:
      - sandbox
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_URL: ${SITE_URL:-}
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # its HTTPS certificates, so they aren't requested again on every restart
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  workspace:
    name: foobar-workspace
  caddy-data:
    name: foobar-caddy-data
  caddy-config:
    name: foobar-caddy-config
